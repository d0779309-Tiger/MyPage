<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表單-飲料訂購</title>
    <link rel="stylesheet" href="CSS (1)/bootstrap.css">
    <link rel="stylesheet" href="CSS (1)/20260127-2 (1).css">
    <style>
        /* ── 覆蓋系統游標 ── */
        *,
        a,
        button,
        input,
        select,
        textarea,
        label {
            cursor: none !important;
        }

        /* ── CUSTOM CURSOR ── */
        #cursor-dot {
            position: fixed;
            width: 8px;
            height: 8px;
            background: #198754;
            border-radius: 50%;
            pointer-events: none;
            z-index: 10000;
            transform: translate(-50%, -50%);
            transition: width 0.3s, height 0.3s, background 0.3s;
            mix-blend-mode: multiply;
        }

        #cursor-ring {
            position: fixed;
            width: 36px;
            height: 36px;
            border: 2px solid rgba(25, 135, 84, 0.5);
            border-radius: 50%;
            pointer-events: none;
            z-index: 10000;
            transform: translate(-50%, -50%);
            transition: width 0.4s cubic-bezier(.23, 1, .32, 1), height 0.4s cubic-bezier(.23, 1, .32, 1), opacity 0.3s;
        }

        body.cursor-hover #cursor-dot {
            width: 16px;
            height: 16px;
            background: #ffc107;
        }

        body.cursor-hover #cursor-ring {
            width: 56px;
            height: 56px;
            border-color: rgba(255, 193, 7, 0.5);
        }

        /* ── MOTION BLUR TRAIL ── */
        #trail-canvas {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 9997;
            opacity: 0.3;
        }
    </style>
</head>

<body>

    <!-- CURSOR -->
    <div id="cursor-dot"></div>
    <div id="cursor-ring"></div>

    <!-- MOTION BLUR TRAIL -->
    <canvas id="trail-canvas"></canvas>

    <div class="container">
        <div class="display-1 text-center bg-success fw-900 rounded-4 pb-1 justify-content-center">飲料訂購</div>
        <div class="row mt-2">
            <div class="col-12">
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" placeholder="" id="name01">
                    <label for="" class="form-check-label text-dark">訂購者名稱1~5字</label>
                    <div class="valid-feedback">輸入符合規定</div>
                    <div class="invalid-feedback">輸入不符合規定</div>
                </div>
            </div>
        </div>
        <div class="display-0 fw-700">產品名稱</div>
        <div class="row">
            <div class="col-12">
                <input type="text" class="form-control" placeholder="字數2~6字" id="name02">
                <div class="valid-feedback">輸入符合規定</div>
                <div class="invalid-feedback">輸入不符合規定</div>
            </div>
        </div>
        <div class="row my-3">
            <div class="col-12">
                <select name="" id="ice" class="form-select form-select-lg">
                    <option value="" class="text-center" disabled selected>--請選擇冰塊--</option>
                    <option value="正常">正常</option>
                    <option value="少冰">少冰</option>
                    <option value="微冰">微冰</option>
                    <option value="去冰">去冰</option>
                </select>
            </div>
        </div>
        <div class="display-6">單點配料(每樣10元)</div>
        <div class="row">
            <div class="col-12 my-2">
                <div class="form-check">
                    <input type="checkbox" name="add" class="form-check-input name03" value="粉圓">
                    <label for="" class="form-check-label">粉圓</label>
                </div>
            </div>
            <div class="col-12 my-2">
                <div class="form-check">
                    <input type="checkbox" name="add" class="form-check-input name03" value="QQ">
                    <label for="" class="form-check-label">QQ</label>
                </div>
            </div>
            <div class="col-12 my-2">
                <div class="form-check">
                    <input type="checkbox" name="add" class="form-check-input name03" value="紅豆">
                    <label for="" class="form-check-label">紅豆</label>
                </div>
            </div>
            <div class="col-12 my-2">
                <div class="form-check">
                    <input type="checkbox" name="add" class="form-check-input name03" value="綠豆">
                    <label for="" class="form-check-label">綠豆</label>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="my-2">
                <label for="" class="form-label h4">數量: <span class="text-warning h2 fw-900"
                        id="num01">1</span>杯</label>
                <input type="range" class="form-range" min="1" max="200" id="num1" step="1" value="1">
            </div>
        </div>
        <div class="row">
            <div class="col-12">
                <div class="my-2">
                    <label for="" class="form-label h4">單價:<span class="text-info h2 fw-900" id="num02">20</span>元
                        配料<span class="text-info h2 fw-900" id="num022">0</span>元</label>
                    <input type="range" class="form-range" min="10" max="50" step="5" value="20" id="num2">
                </div>
            </div>
        </div>
        <div class="row mb-3">
            <div class="col-12">
                <label for="">備註(1~50)字</label>
                <textarea name="" id="" class="form-control"></textarea>
            </div>
        </div>
        <div class="h2 text-danger fw-900">總價: <span class="h1 text-danger" id="totalPrice"></span></div>
        <div class="text-center">
            <button class="btn btn-warning" id="check">確認</button>
            <button class="btn btn-secondary">取消</button>
        </div>
        <div class="showcast d-none">
            <div class="col-md-12 mt-5">
                <div class="display-1 text-bg-warning text-center rounded-4 fw-900 pb-2 mb-3">飲料訂購明細</div>
            </div>
            <div class="border border-3 rounded-4 shadow-sm p-3 mb-2" id="showlist">
                <h1 class="fw-900">產品品項: XXXXXX</h1>
            </div>
            <div class="text-center">
                <button class="btn btn-danger order_btn">確認訂單</button>
            </div>
        </div>
    </div>

    <script src="JS/bootstrap.bundle.js"></script>
    <script src="JS/jquery-4.0.0.js"></script>
    <script src="JS/sweetalert2.all.min.js"></script>
    <script>
        let flag_name01 = false;
        let flag_name02 = false;
        let flag_ice = false;
        let flag_chk_content = [];
        let uniPrice = 0;
        let totalPrice = 0;
        let chk_content = [];

        $(function () {
            $('#name01').blur(function () {
                if ($(this).val().length > 0 && $(this).val().length < 6) {
                    $(this).removeClass("is-invalid").addClass("is-valid");
                    flag_name01 = true;
                } else {
                    $(this).removeClass("is-valid").addClass("is-invalid");
                    flag_name01 = false;
                }
            });

            $('#name02').blur(function () {
                if ($(this).val().length > 1 && $(this).val().length < 7) {
                    $(this).removeClass("is-invalid").addClass("is-valid");
                    flag_name02 = true;
                } else {
                    $(this).removeClass("is-valid").addClass("is-invalid");
                    flag_name02 = false;
                }
            });

            $('#ice').change(function () {
                $(this).removeClass("is-invalid").addClass("is-valid");
                flag_ice = true;
            });

            $('#num1').on("input", function () {
                $('#num01').text($(this).val());
                // 補上這段 ↓
                totalPrice = $(this).val() * uniPrice;
                $("#totalPrice").text(totalPrice);
            });

            $('#num2').on("input", function () {
                $('#num02').text($(this).val());
                chk_content = [];
                $("input[name = 'add']:checked").each(function () {
                    chk_content.push($(this).val());
                });
                $('#num022').text(chk_content.length * 10);
                uniPrice = Number($(this).val()) + Number(chk_content.length * 10);
                totalPrice = $('#num1').val() * uniPrice;
                $("#totalPrice").text(totalPrice);
            });

            $("#check").click(function () {
                if (flag_name01 && flag_name02 && flag_ice) {
                    $('.showcast').removeClass('d-none');
                    let strHTML = `<h1 class="fw-900">訂購者: ${$('#name01').val()}</h1>
                                   <h1 class="fw-900">產品品項: ${$('#name02').val()}</h1>
                                   <h1 class="fw-900">冰塊: ${$('#ice').val()}</h1>
                                   <h1 class="fw-900">單點配料(每樣10元): ${chk_content.join(",")}</h1>
                                   <h1 class="fw-900">數量: ${$('#num1').val()}杯</h1>
                                   <h1 class="fw-900">單價(每杯): ${$('#num2').val()} 配料:${Number(chk_content.length * 10)}元</h1>
                                   <h1 class="fw-900">總價: ${totalPrice}元</h1>`;
                    $("#showlist").html(strHTML);
                } else {
                    alert("表單欄位有錯!");
                }
            });

            $(".order_btn").click(function () {
                let orderData = {
                    username: $('#name01').val(),
                    pname: $('#name02').val(),
                    ice: $('#ice').val(),
                    toppings: chk_content,
                    quantity: $('#num1').val(),
                    unit_price: $('#num2').val(),
                    topping_fee: Number(chk_content.length * 10),
                    total_price: totalPrice,
                    created_at: new Date().toLocaleString()
                };
                $.ajax({
                    type: "POST",
                    url: "http://localhost:3000/orders",
                    contentType: "application/json",
                    data: JSON.stringify(orderData),
                    success: function (data) {
                        console.log("新增成功!");
                        Swal.fire({
                            title: "新增成功!",
                            showDenyButton: false,
                            showCancelButton: false,
                            confirmButtonText: "確認",
                            denyButtonText: `Don't save`
                        }).then((result) => {
                            if (result.isConfirmed) {
                                $('.showcast').addClass('d-none');
                            }
                        });
                    },
                    error: function () { alert("新增失敗!"); }
                });
            });
        });
    </script>

    <!-- ── CURSOR & TRAIL SCRIPTS ── -->
    <script>
        /* ═══════════════════════════════════════════
           MOTION BLUR TRAIL CANVAS
        ═══════════════════════════════════════════ */
        (function () {
            const canvas = document.getElementById('trail-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            let mx = -200, my = -200;
            const trail = [];
            const MAX = 28;

            document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });

            function lerp(a, b, t) { return a + (b - a) * t; }

            let cx = mx, cy = my;
            function animateTrail() {
                requestAnimationFrame(animateTrail);
                cx = lerp(cx, mx, 0.18);
                cy = lerp(cy, my, 0.18);
                trail.push({ x: cx, y: cy });
                if (trail.length > MAX) trail.shift();

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (let i = 1; i < trail.length; i++) {
                    const p0 = trail[i - 1], p1 = trail[i];
                    const alpha = (i / trail.length) * 0.35;
                    const radius = (i / trail.length) * 7;
                    ctx.beginPath();
                    ctx.moveTo(p0.x, p0.y);
                    ctx.lineTo(p1.x, p1.y);
                    ctx.strokeStyle = `rgba(200,133,58,${alpha})`;
                    ctx.lineWidth = radius;
                    ctx.lineCap = 'round';
                    ctx.stroke();
                }
            }
            animateTrail();

            window.addEventListener('resize', () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            });
        })();

        /* ═══════════════════════════════════════════
           CUSTOM CURSOR
        ═══════════════════════════════════════════ */
        (function () {
            const dot = document.getElementById('cursor-dot');
            const ring = document.getElementById('cursor-ring');
            let rx = 0, ry = 0, mx = 0, my = 0;

            document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });

            function animCursor() {
                requestAnimationFrame(animCursor);
                dot.style.left = mx + 'px';
                dot.style.top = my + 'px';
                rx += (mx - rx) * 0.12;
                ry += (my - ry) * 0.12;
                ring.style.left = rx + 'px';
                ring.style.top = ry + 'px';
            }
            animCursor();

            document.querySelectorAll('a, button, .menu-card, .value-card, .testimonial-card').forEach(el => {
                el.addEventListener('mouseenter', () => document.body.classList.add('cursor-hover'));
                el.addEventListener('mouseleave', () => document.body.classList.remove('cursor-hover'));
            });
        })();
        // 讓互動元素也觸發 hover 效果
        document.querySelectorAll('a, button, input, select, textarea, label, .form-check').forEach(el => {
            el.addEventListener('mouseenter', () => document.body.classList.add('cursor-hover'));
            el.addEventListener('mouseleave', () => document.body.classList.remove('cursor-hover'));
        });
    </script>

</body>

</html>
